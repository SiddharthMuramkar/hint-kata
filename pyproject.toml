[project]
name = "hint-kata"
version = "0.1.0"
description = "Interactive lessons for Pydantic AI, FastAPI and GitHub flow in the Claude Code era"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.143.0",
    "fastapi-cli==0.0.32",
    "uvicorn[standard]==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "markdown-it-py==4.2.0",
    "mdit-py-plugins==0.6.1",
    "pygments==2.21.0",
    "fsrs==6.3.2",
    "pydantic-ai-slim[openrouter]==2.56.0",
    "pydantic-evals==2.56.0",
    "pydantic-settings==2.16.0",
    "pyyaml==6.0.3",
    "logfire[fastapi]==5.2.0",
    "psycopg[binary]==3.3.6",
    "pgvector==0.5.1",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.17.0",
    "ty==0.0.87",
]

[tool.ruff]
line-length = 100
exclude = ["docs", ".cache", "workspace"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.src]
exclude = ["content/**/task/**", "workspace/**", ".cache/**"]

[tool.ty.environment]
python-version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.vercel]
entrypoint = "app.main:app"
