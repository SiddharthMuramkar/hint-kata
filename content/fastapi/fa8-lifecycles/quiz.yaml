items:
  - id: q1
    type: single
    concept: swallowed-exception
    source_section: what-the-tear-down-sees-exceptions
    prompt: >-
      A route raises `HTTPException(status_code=404)`. Its dependency is written like this:
      `try: yield db`, then `except HTTPException: log("route failed")`, then
      `finally: db.close()`. The `except` block does not raise again. What happens?
    options:
      - text: >-
          The client gets a 500. The `except` block catches the 404 and ends quietly, so
          FastAPI never sees the error. `db.close()` still runs.
        correct: true
        feedback: >-
          Right. An exception that you catch and do not raise again stops there, as in any Python
          code. FastAPI sees a dependency that ended normally after a route that failed, and it
          answers 500. The fix is a bare `raise` at the end of the `except` block.
      - text: >-
          The client gets the 404. The `except` block logs, and then the exception carries on to
          the client. `db.close()` runs.
        misconception: Thinks an exception carries on by itself after an `except` block has handled it.
        feedback: >-
          Only a `raise` sends it on. Without one, the `except` block has dealt with it, and
          the 404 never reaches FastAPI's error handling.
      - text: >-
          The client gets a 200 with an empty body, because the dependency handled the error.
        misconception: Thinks catching the error in the dependency turns the request into a success.
        feedback: >-
          A route that raised has no return value to send. FastAPI saw a failed route and a
          dependency that said nothing, and in our run the client got a 500.
      - text: >-
          The client gets the 404, but `db.close()` is skipped because the `except` block ran
          first.
        misconception: Thinks `finally` is skipped when an `except` block has already run.
        feedback: >-
          `finally` runs on every path, whether or not an `except` block ran. That is the reason
          to put the clean-up there. The status is wrong as well: this dependency gives a 500.
  - id: q2
    type: single
    concept: scope-timing
    source_section: scope-before-or-after-the-response
    prompt: >-
      A route uses `Depends(get_conn, scope="function")`, and `get_conn` has a `yield`. The route
      returns normally. When does the code after the `yield` run?
    options:
      - text: Right after the route function returns, and before the response is sent.
        correct: true
        feedback: >-
          Right. `scope="function"` means the dependency lives around the route function only.
          It is closed as soon as the function ends, before the response goes to the client. It
          was added in FastAPI 0.121.
      - text: After the response has been sent. This is the same as the default.
        misconception: Thinks `scope="function"` is the same as the default scope.
        feedback: >-
          The default for a `yield` dependency is `scope="request"`, and that is the one that
          closes after the response is sent. `scope="function"` is the early one.
      - text: Before the route function runs, right after the code before the `yield`.
        misconception: Thinks `function` scope releases the resource at the start of the function.
        feedback: >-
          The route needs the yielded value while it runs. The dependency stays open for the whole
          function, and its tear-down comes after the function ends.
      - text: When the app shuts down.
        misconception: Confuses a dependency's tear-down with the app's lifespan shutdown.
        feedback: >-
          A `yield` dependency is torn down for each request. Something that is closed once, at
          shutdown, belongs in the lifespan.
  - id: q3
    type: single
    concept: test-client-lifespan
    source_section: testing-lifespan-code
    prompt: >-
      Spot the bug. The app has a lifespan that opens a pool and ends with
      `yield {"pool": pool}`. A route reads `request.state.pool`. In `fastapi dev` the route
      works. In this test file it returns a 500 every time: `client = TestClient(app)` at the top,
      then `client.get("/rows")`. What is wrong?
    options:
      - text: >-
          The test never starts the lifespan. Use `with TestClient(app) as client:` so that
          start-up runs, and shutdown runs when the block ends.
        correct: true
        feedback: >-
          Right. A bare `TestClient(app)` does not run the lifespan, so the pool was never
          opened and `request.state.pool` is missing. Used as a context manager, the client runs
          start-up when the block begins and shutdown when it ends.
      - text: >-
          `request.state` only exists on a real server. In tests, read the pool from a global
          variable instead.
        misconception: Thinks `request.state` is not available under the test client.
        feedback: >-
          `request.state` works under the test client. The entries are missing only because the
          lifespan that fills them did not run.
      - text: >-
          The route must be declared with `async def`. A plain `def` route cannot see lifespan
          state.
        misconception: Thinks lifespan state is visible only to `async def` routes.
        feedback: >-
          Sync and async routes both read `request.state`. The state is empty here because the
          lifespan did not start.
      - text: >-
          The lifespan has to be passed to the client: `TestClient(app, lifespan=lifespan)`.
        misconception: Thinks the test client takes its own lifespan argument.
        feedback: >-
          The app already owns its lifespan, set in `FastAPI(lifespan=...)`. The client only has
          to start it, and it does that when used in a `with` block.
  - id: q4
    type: single
    concept: scope-rule
    source_section: scope-before-or-after-the-response
    prompt: >-
      `outer` is a `yield` dependency with the default scope. It depends on `inner`, which is
      declared as `Depends(inner, scope="function")`. A route uses `Depends(outer)`. What does
      FastAPI 0.143.0 do?
    options:
      - text: >-
          It raises a `DependencyScopeError` when the route is declared, before any request.
        correct: true
        feedback: >-
          Right. The tear-down of `outer` may still need `inner`. A function-scoped `inner`
          would already be closed by then, so FastAPI refuses the combination up front. The
          other direction is allowed: a function-scoped dependency may use request-scoped ones.
      - text: >-
          It works. `inner` closes before the response and `outer` closes after it.
        misconception: Thinks each dependency's scope works on its own, whatever it depends on.
        feedback: >-
          `outer` can use `inner` in its own tear-down, so `inner` has to outlive it. A request
          scope cannot lean on something that closes earlier.
      - text: >-
          The first request gets a 500. After that, requests work.
        misconception: Thinks the scope problem shows up only at request time.
        feedback: >-
          FastAPI checks scopes while it builds the route. The error comes at declaration, so the
          app does not even start.
      - text: >-
          FastAPI quietly changes `inner` to `scope="request"` and carries on.
        misconception: Thinks FastAPI repairs a scope conflict by itself.
        feedback: >-
          FastAPI does not guess. It raises an error that names the dependency, and you decide
          which scope each one should have.
  - id: q5
    type: order
    concept: teardown-order
    source_section: several-yield-dependencies-tear-down-in-reverse
    prompt: >-
      Dependency `c` depends on `b`, and `b` depends on `a`. All three use `yield`, and the
      route uses `c`. Put the events of one normal request in order.
    steps:
      - "`a` runs its code up to the `yield`"
      - "`b` runs its code up to the `yield`"
      - "`c` runs its code up to the `yield`"
      - "The route function runs"
      - "`c` runs its code after the `yield`"
      - "`b` runs its code after the `yield`"
      - "`a` runs its code after the `yield`"
    explanation: >-
      Set-up starts at the deepest dependency, because `b` needs the value from `a`, and `c`
      needs the one from `b`. The route runs when all values are ready. Tear-down goes the other
      way, so each dependency can still use the ones it depends on while it cleans up.
  - id: q6
    type: blank
    concept: lifespan-state
    source_section: lifespan-state-and-requeststate
    prompt: >-
      The lifespan ends with `yield {"pool": pool}`. Fill in the blank to read the pool inside a
      dependency that takes `request: Request`:
      `pool = request.____.pool`
    answer: state
    explanation: >-
      The entries of the yielded dict become attributes of `request.state`. The other way is to
      set `app.state.pool` in the lifespan and read `request.app.state.pool`.
